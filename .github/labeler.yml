# actions/labeler@v4+ changed-files syntax
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - '**/*.md'
          - docs/**/*

ui:
  - changed-files:
      - any-glob-to-any-file:
          - src/components/**/*
          - src/**/*.css
          - src/App.css
          - src/index.css

pages:
  - changed-files:
      - any-glob-to-any-file:
          - src/pages/**/*

data:
  - changed-files:
      - any-glob-to-any-file:
          - src/data/**/*

hooks:
  - changed-files:
      - any-glob-to-any-file:
          - src/hooks/**/*

config:
  - changed-files:
      - any-glob-to-any-file:
          - '*.config.js'
          - '*.config.ts'
          - tsconfig*.json
          - .github/**/*
          - package.json
          - package-lock.json

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - package-lock.json
          - bun.lockb
